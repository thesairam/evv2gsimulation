services:
  energy-forecast:
    build: .
    container_name: energy-forecast
    volumes:
      - ./output:/app/output
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: >
      python -u main.py
        --days 14
        --output-dir /app/output
        --live-cycles 3
        --fast-mode
